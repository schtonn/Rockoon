name: Native desktop

on:
  push:
    branches: [codex/native-desktop]
    paths: ["native/**", "src-tauri/src/ballance/**", "src-tauri/src/commands/**", "src-tauri/resources/vanilla/**", "src/i18n/languages/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "src-tauri/src/ballance/**", "src-tauri/src/commands/**", "src-tauri/resources/vanilla/**", "src/i18n/languages/**", ".github/workflows/native.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      # The inherited Explorer test assumes an interactive Windows desktop.
      - run: cargo test --manifest-path native/Cargo.toml --locked --workspace -- --skip finds_explorer_and_rejects_non_player
      - run: cargo build --release --manifest-path native/Cargo.toml --locked
      - shell: pwsh
        run: |
          Copy-Item native/target/release/rockoon-native.exe Rockoon-native-windows-x64.exe
          Copy-Item native/resources/fonts/LICENSE.txt Rockoon-SourceHanSans-LICENSE.txt
          (Get-FileHash Rockoon-native-windows-x64.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii Rockoon-native-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Rockoon-native-windows-x64
          path: |
            Rockoon-native-windows-x64.exe
            Rockoon-native-windows-x64.exe.sha256
            Rockoon-SourceHanSans-LICENSE.txt

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Test native workspace
        run: |
          set +e
          cargo test --manifest-path native/Cargo.toml --locked --workspace > "$RUNNER_TEMP/native-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/native-tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"], "native-tests.log").read_text()
          import re
          tail = re.sub(r"\x1b\[[0-9;]*m", "", log)[-3500:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Native workspace tests::" + escaped)
          PY
          fi
          exit "$result"
      - run: cargo build --manifest-path native/Cargo.toml --locked --release --target aarch64-apple-darwin
      - run: cargo build --manifest-path native/Cargo.toml --locked --release --target x86_64-apple-darwin
      - name: Prepare original Wine runtime and retry launcher
        run: |
          brew list zig >/dev/null 2>&1 || brew install zig
          node scripts/fetch-wine.mjs
          zig cc -target x86-windows-gnu -Os -s -o src-tauri/resources-macos/wine/BallanceLauncher.exe src-launcher/launch.c -luser32 -lshell32
      - name: Bundle native application
        run: python3 native/scripts/bundle-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rockoon-native-macos-universal
          path: native/target/bundle/Rockoon-native-macos-universal.tar.gz
