[package]
name = "rockoon-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rockoon-core = { path = "../core" }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp","Win32_System_Memory"] }
