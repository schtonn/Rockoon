[package]
name = "rockoon-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "crisp", "tokio", "svg"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
