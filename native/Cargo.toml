[package]
name = "rockoon-native"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
rockoon-core = { path = "core" }
rockoon-platform = { path = "platform" }
sha2 = "0.10"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", features = ["json"] }
url = "2"
flate2 = "1"
fs2 = "0.4"

iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "crisp", "tokio", "image-without-codecs", "canvas", "advanced"] }
bitmap = { package = "image", version = "0.25", default-features = false, features = ["bmp", "tga"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["core", "platform"]
default-members = ["."]
resolver = "3"
